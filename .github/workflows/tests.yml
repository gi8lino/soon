name: Validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"
      - name: Run Swift tests
        run: make test
      - name: Build universal package
        run: make package ARCH=universal VERSION=0.0.0
      - name: Verify universal package
        run: make verify-release ARCH=universal VERSION=0.0.0
